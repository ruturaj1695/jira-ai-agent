[project]
name = "rtb-jira-ai-agent"
version = "0.1.0"
description = "Agentic AI system for Jira question answering and sprint reporting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.28,<1.0",
  "langchain>=0.3,<1.0",
  "langchain-openai>=0.3,<1.0",
  "langchain-community>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
  "chromadb>=0.6,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
